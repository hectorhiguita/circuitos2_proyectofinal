# Mosquitto 2 - broker MQTT del Medidor PPG
# Puerto 1883 abierto a la LAN para que el ESP32 publique. Sin acceso anónimo.

per_listener_settings false
listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistencia: mensajes retenidos (config, online) y sesiones sobreviven a reinicios
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_keepalive 120
max_inflight_messages 20
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
