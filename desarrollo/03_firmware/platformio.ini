; Medidor de ritmo cardiaco PPG - ESP32-C3 SuperMini
; Ver README.md. Entornos:
;   c3       firmware normal (sensor analógico en GPIO1)
;   c3_demo  firmware con señal PPG sintética (sin tarjeta analógica)
;   c3_oled  como c3 pero con la OLED 0.96" I2C en vez de la TFT 1.3"
;   native   pruebas unitarias de DSP en el PC (pio test -e native)

[platformio]
default_envs = c3

[esp32c3_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 4MB
; 1.9 MB por app (mantiene OTA); el esquema por defecto (1.25 MB) queda al 88 %
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.11
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1

[env:c3]
extends = esp32c3_base

[env:c3_demo]
extends = esp32c3_base
build_flags =
    ${esp32c3_base.build_flags}
    -DDEMO_SENSOR=1

[env:c3_oled]
extends = esp32c3_base
build_flags =
    ${esp32c3_base.build_flags}
    -DPANTALLA_TFT=0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -lm
